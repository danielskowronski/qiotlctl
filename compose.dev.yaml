---
# Isolated development VM; no production services or MQTT publications.
services:
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.154.0
    ports:
      - "127.0.0.1:18428:8428"
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=18
      - -dedup.minScrapeInterval=1ms
      - -memory.allowedBytes=256MiB
    mem_limit: 512m
    volumes:
      - vm-dev-data:/storage
volumes:
  vm-dev-data:
