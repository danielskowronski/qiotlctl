---
{{- if ne .Values.monitoring.kind "none" }}
{{- if eq .Values.monitoring.kind "vmServiceScrape" }}
{{- if not (.Capabilities.APIVersions.Has "operator.victoriametrics.com/v1beta1/VMServiceScrape") }}
{{- fail "monitoring.kind=vmServiceScrape requires the VMServiceScrape CRD" }}
{{- end }}
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
{{- else }}
{{- if not (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1/ServiceMonitor") }}
{{- fail "monitoring.kind=serviceMonitor requires the ServiceMonitor CRD" }}
{{- end }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
{{- end }}
metadata:
  name: {{ include "qiotlctl.fullname" . }}
  labels:
    {{- include "qiotlctl.labels" . | nindent 4 }}
    {{- with .Values.monitoring.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "qiotlctl.selectorLabels" . | nindent 6 }}
  namespaceSelector:
    matchNames: [{{ .Release.Namespace | quote }}]
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.monitoring.interval }}
      scrapeTimeout: {{ .Values.monitoring.scrapeTimeout }}
{{- end }}
