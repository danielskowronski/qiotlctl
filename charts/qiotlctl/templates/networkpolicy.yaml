---
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "qiotlctl.fullname" . }}
  labels:
    {{- include "qiotlctl.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "qiotlctl.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress: {{ toYaml .Values.networkPolicy.additionalIngress | nindent 4 }}
  egress:
    {{- range .Values.networkPolicy.egressEndpoints }}
    - to:
        - {{- omit . "ports" | toYaml | nindent 10 }}
      ports:
        {{- .ports | toYaml | nindent 8 }}
    {{- end }}
    {{- if .Values.networkPolicy.allowDNS }}
    - to:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.dnsNamespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicy.dnsPodSelector | nindent 12 }}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    {{- else if not .Values.networkPolicy.egressEndpoints }} []
    {{- end }}
{{- end }}
