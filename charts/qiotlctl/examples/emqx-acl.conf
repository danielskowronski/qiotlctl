%% EMQX file-authorizer example; this chart does NOT install broker ACLs.
%% Append to the broker's existing rules before any matching deny rule.
%% Replace both usernames with the actual MQTT login names, not Secret names.
%% Defaults: device topics qingping/#, HA discovery homeassistant, state qiotlctl.
%% Adapt these filters when changing topics/prefixes in application config.

%% qiotld: all device uplinks/downlinks, decoded state and availability.
%% "all" allows publish and subscribe, with all QoS/retain combinations.
{allow, {username, "QIOTLD_MQTT_USERNAME"}, all, [
    "qingping/#",
    "qiotlctl/#"
]}.

%% Broad sensor discovery access: retained publish/cleanup plus subscribe
%% for daemon/doctor readback. Readiness requires this verification.
%% This covers ALL sensor discovery, not only Qingping. MQTT wildcards cannot
%% match a partial level such as qingping_*; use exact node IDs to narrow it.
{allow, {username, "QIOTLD_MQTT_USERNAME"}, all, [
    "homeassistant/sensor/#"
]}.

%% qiotld subscribes to HA's birth topic before announcing discovery.
{allow, {username, "QIOTLD_MQTT_USERNAME"}, subscribe, [
    "homeassistant/status"
]}.

%% HA: discovery, decoded sensor states and both availability topics.
{allow, {username, "HA_MQTT_USERNAME"}, subscribe, [
    "homeassistant/#",
    "qiotlctl/#"
]}.

%% HA's online birth message and offline last will.
{allow, {username, "HA_MQTT_USERNAME"}, publish, [
    "homeassistant/status"
]}.

%% Keep the broker's existing rules for other users/integrations and its
%% fallback policy. This snippet intentionally adds no global allow or deny.
